services:
  caddy:
    build:
      context: ./portfolio
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # TLS certificates (persisted across restarts)
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
